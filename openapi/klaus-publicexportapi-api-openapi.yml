openapi: 3.2.0
info:
  title: Public Export API
  description: 'Export data from Zendesk QA.


    ### Rate Limits:


    - API request limit: **1,500 requests per minute per IP**'
  version: '1.0'
servers:
- url: https://yoursubdomain.zendesk.com/qa
security:
- ApiKeyAuth: []
tags:
- name: PublicExportApi
paths:
  /api/export/autoqa/ratings:
    get:
      summary: AutoQARatings returns AutoQA rating rows for export
      operationId: PublicExportApi_AutoQARatings
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoAutoQARatingsExportResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: fromDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: workspaceId
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: connectionId
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: revieweeExternalId
        in: query
        required: false
        schema:
          type: string
      - name: latestOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: autoqaCategoryType
        in: query
        required: false
        schema:
          type: string
      - name: ratingCategoryId
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: rootCauseCode
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      tags:
      - PublicExportApi
  /api/export/autoqa/reviews:
    get:
      summary: AutoQAReviews returns AutoQA review rows for export
      operationId: PublicExportApi_AutoQAReviews
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoAutoQAReviewsExportResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: fromDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: workspaceId
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: connectionId
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: revieweeExternalId
        in: query
        required: false
        schema:
          type: string
      - name: latestOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      tags:
      - PublicExportApi
  /api/export/conversations/search:
    post:
      summary: ConversationSearch returns conversation data for the given request
      operationId: PublicExportApi_ConversationSearch
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoConversationSearchResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      tags:
      - PublicExportApi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/protoConversationSearchRequest'
        required: true
  /api/export/csat:
    get:
      summary: CSATByAccount returns CSAT for tickets
      operationId: PublicExportApi_CSATByAccount
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoCSATResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: workspace
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: fromDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - PublicExportApi
  /api/export/quizzes:
    get:
      summary: Quizzes returns all quizzes
      operationId: PublicExportApi_Quizzes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoQuizListResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      tags:
      - PublicExportApi
  /api/export/quizzes/leaderboard:
    get:
      summary: QuizzesLeaderboard returns leaderboard of quizzes
      operationId: PublicExportApi_QuizzesLeaderboard
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoQuizLeaderboardResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      tags:
      - PublicExportApi
  /api/export/quizzes/{id}/overview:
    get:
      summary: QuizOverview returns specific quiz overview
      operationId: PublicExportApi_QuizOverview
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoQuizWithStatistics'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      tags:
      - PublicExportApi
  /api/export/quizzes/{id}/responses:
    get:
      summary: QuizResponses returns responses for specific quiz
      operationId: PublicExportApi_QuizResponses
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoQuizResponseItems'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      tags:
      - PublicExportApi
  /api/export/quizzes/{id}/responses/{response}:
    get:
      summary: QuizResponse returns a single response for the specific quiz
      operationId: PublicExportApi_QuizResponse
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoQuizAndResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - name: response
        in: path
        required: true
        schema:
          type: string
          format: int64
      tags:
      - PublicExportApi
  /api/export/reviews:
    get:
      summary: AccountReviews returns reviews and associated comments
      operationId: PublicExportApi_AccountReviews
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoExportAPIReviewsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: fromDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - PublicExportApi
  /api/export/users:
    get:
      summary: Users returns users belonging to specified account
      operationId: PublicExportApi_Users
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoExportAPIUsersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      tags:
      - PublicExportApi
  /api/export/workspace/{workspace}/calibration-sessions:
    get:
      operationId: PublicExportApi_CalibrationSessions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoExportAPICalibrationSessionsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          format: int64
      - name: fromDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - PublicExportApi
      summary: Public export api calibration sessions
      x-summary-source: derived
  /api/export/workspace/{workspace}/csat:
    get:
      summary: CSATByAccountAndWorkspace returns CSAT for tickets
      operationId: PublicExportApi_CSATByAccountAndWorkspace
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoCSATResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          format: int64
      - name: fromDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - PublicExportApi
  /api/export/workspace/{workspace}/disputes:
    get:
      summary: Disputes returns disputes
      operationId: PublicExportApi_Disputes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoExportAPIDisputesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          format: int64
      - name: fromDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - PublicExportApi
  /api/export/workspace/{workspace}/reviews:
    get:
      summary: Reviews returns reviews and associated comments
      operationId: PublicExportApi_Reviews
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoExportAPIReviewsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          format: int64
      - name: fromDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - PublicExportApi
  /api/export/workspace/{workspace}/scorecards:
    get:
      operationId: PublicExportApi_WorkspaceScorecards
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoWorkspaceScorecardsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          format: int64
      tags:
      - PublicExportApi
      summary: Public export api workspace scorecards
      x-summary-source: derived
  /api/export/workspace/{workspace}/users:
    get:
      summary: WorkspaceUsers returns users belonging to specified account and workspace
      operationId: PublicExportApi_WorkspaceUsers
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoExportAPIUsersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          format: int64
      tags:
      - PublicExportApi
  /api/export/workspaces:
    get:
      operationId: PublicExportApi_Workspaces
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoAccountWorkspacesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/googlerpcStatus'
      tags:
      - PublicExportApi
      summary: Public export api workspaces
      x-summary-source: derived
components:
  schemas:
    protoQuizLeaderboardResponse:
      type: object
      properties:
        leaderboardUsers:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoQuizLeaderboardUser'
    protoQuizFieldProperty:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    protoAutoQARatingRow:
      type: object
      properties:
        autoqaRatingId:
          type: string
        autoqaReviewId:
          type: string
        accountId:
          type: string
          format: int64
        workspaceId:
          type: string
          format: int64
        workspaceName:
          type: string
        connectionId:
          type: string
          format: int64
        externalTicketId:
          type: string
        conversationCreatedAt:
          type: string
          format: date-time
        appConversationLink:
          type: string
        externalConversationLink:
          type: string
        revieweeExternalId:
          type: string
        revieweeInternalId:
          type: string
        revieweeName:
          type: string
        revieweeEmail:
          type: string
        ratingCategoryId:
          type: string
          format: int64
        ratingCategoryName:
          type: string
        autoqaCategoryType:
          type: string
        categoryDisplayName:
          type: string
        scorecardId:
          type: string
          format: int64
        scorecardName:
          type: string
        score:
          type: number
          format: double
        ratingScaleScore:
          type: number
          format: double
        ratingMax:
          type: number
          format: double
        ratingRangeMax:
          type: number
          format: double
        weight:
          type: number
          format: double
        isCritical:
          type: boolean
        reviewCritical:
          type: boolean
        groupCritical:
          type: boolean
        evaluated:
          type: boolean
        rootCauseCodes:
          type: array
          items:
            type: string
        rootCauses:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        paymentId:
          type: string
          format: int64
    protoExportAPIUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoExportAPIUser'
    protoQuizWithStatistics:
      type: object
      properties:
        id:
          type: string
          format: int64
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/protoStatus'
        createdBy:
          type: string
          format: int64
        updatedBy:
          type: string
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedDate:
          type: string
          format: date-time
        responseCount:
          type: string
          format: int64
        fields:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoQuizFieldWithStatistics'
        averageScorePercentage:
          type: string
          format: int64
    AdvancedScorecardRating:
      type: object
      properties:
        rating:
          type: integer
          format: int32
        freeTextAllowed:
          type: boolean
        rootCauses:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AdvancedScorecardScorecardRootCause'
        tiers:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AdvancedScorecardScorecardRootCauseTier'
        multiTierRootCause:
          $ref: '#/components/schemas/AdvancedScorecardMultiTierRootCause'
    AdvancedScorecardScorecardRatingCategoryCondition:
      type: object
      properties:
        condition:
          type: string
        type:
          type: string
        values:
          type: array
          items:
            type: string
    protoScorecard:
      type: object
      properties:
        id:
          type: string
          format: int64
        name:
          type: string
    protoQuizFieldWithStatistics:
      type: object
      properties:
        id:
          type: string
          format: int64
        text:
          type: string
        images:
          type: array
          items:
            type: string
        properties:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoQuizFieldProperty'
        type:
          $ref: '#/components/schemas/protoQuizFieldType'
        position:
          type: string
          format: int64
        options:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoQuizFieldOptionWithStatistics'
    protoPromptAnomalies:
      type: object
      properties:
        highNaRate:
          type: boolean
    protoExportAPIDisputeComment:
      type: object
      properties:
        comment:
          type: string
        commentTags:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoExportAPITagRequest'
        owner:
          $ref: '#/components/schemas/protoUserData'
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        thread:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoExportAPIDisputeComment'
        Id:
          type: string
          format: int64
    protoPagination:
      type: object
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    protoQuizResponseItems:
      type: object
      properties:
        responses:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoQuizResponseItem'
    protoQuizFieldType:
      type: string
      enum:
      - MULTIPLE_CHOICE
      default: MULTIPLE_CHOICE
    protoWorkspaceScorecardsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/AdvancedScorecardWorkspaceScorecard'
        total:
          type: integer
          format: int32
    protoTimeTrackingPeriod:
      type: object
      properties:
        type:
          type: string
        duration:
          type: string
          format: int64
    protoExportAPIDisputesResponse:
      type: object
      properties:
        disputes:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoExportAPIDispute'
        pagination:
          $ref: '#/components/schemas/protoPagination'
    protoExportAPIUser:
      type: object
      properties:
        id:
          type: string
          format: int64
        name:
          type: string
        email:
          type: string
    protoExportAPIDispute:
      type: object
      properties:
        account:
          type: string
          format: int64
        workspace:
          type: string
          format: int64
        conversationId:
          type: string
        connectionId:
          type: string
          format: int64
        reviewId:
          type: string
          format: int64
        disputeId:
          type: string
        type:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/protoUserData'
        assignee:
          $ref: '#/components/schemas/protoUserData'
        status:
          type: string
        resolutionTime:
          type: string
          format: int64
        categories:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoExportAPIDisputeCategory'
        comment:
          $ref: '#/components/schemas/protoExportAPIDisputeComment'
        resolvedAt:
          type: string
          format: date-time
        rejectedBy:
          $ref: '#/components/schemas/protoUserData'
    googlerpcStatus:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protobufAny'
    protoAutoQARatingsExportResponse:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoAutoQARatingRow'
        pagination:
          $ref: '#/components/schemas/protoPagination'
        nextCursor:
          type: string
    protoExportAPICommentTag:
      type: object
      properties:
        tag:
          type: string
        user:
          $ref: '#/components/schemas/protoReviewsUser'
    protoExternalField:
      type: object
      properties:
        externalId:
          type: string
        name:
          type: string
        value:
          type: string
    protobufAny:
      type: object
      properties:
        '@type':
          type: string
          description: "A URL/resource name that uniquely identifies the type of the serialized\nprotocol buffer message. This string must contain at least\none \"/\" character. The last segment of the URL's path must represent\nthe fully qualified name of the type (as in\n`path/google.protobuf.Duration`). The name should be in a canonical form\n(e.g., leading \".\" is not accepted).\n\nIn practice, teams usually precompile into the binary all types that they\nexpect it to use in the context of Any. However, for URLs which use the\nscheme `http`, `https`, or no scheme, one can optionally set up a type\nserver that maps type URLs to message definitions as follows:\n\n* If no scheme is provided, `https` is assumed.\n* An HTTP GET on the URL must yield a [google.protobuf.Type][]\n  value in binary format, or produce an error.\n* Applications are allowed to cache lookup results based on the\n  URL, or have them precompiled into a binary to avoid any\n  lookup. Therefore, binary compatibility needs to be preserved\n  on changes to types. (Use versioned type names to manage\n  breaking changes.)\n\nNote: this functionality is not currently available in the official\nprotobuf release, and it is not used for type URLs beginning with\ntype.googleapis.com. As of May 2023, there are no widely used type server\nimplementations and no plans to implement one.\n\nSchemes other than `http`, `https` (or the empty scheme) might be\nused with implementation specific semantics."
      additionalProperties: {}
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nProtobuf library provides support to pack/unpack Any values in the form\nof utility functions or additional generated methods of the Any type.\n\nExample 1: Pack and unpack a message in C++.\n\n    Foo foo = ...;\n    Any any;\n    any.PackFrom(foo);\n    ...\n    if (any.UnpackTo(&foo)) {\n      ...\n    }\n\nExample 2: Pack and unpack a message in Java.\n\n    Foo foo = ...;\n    Any any = Any.pack(foo);\n    ...\n    if (any.is(Foo.class)) {\n      foo = any.unpack(Foo.class);\n    }\n    // or ...\n    if (any.isSameTypeAs(Foo.getDefaultInstance())) {\n      foo = any.unpack(Foo.getDefaultInstance());\n    }\n\n Example 3: Pack and unpack a message in Python.\n\n    foo = Foo(...)\n    any = Any()\n    any.Pack(foo)\n    ...\n    if any.Is(Foo.DESCRIPTOR):\n      any.Unpack(foo)\n      ...\n\n Example 4: Pack and unpack a message in Go\n\n     foo := &pb.Foo{...}\n     any, err := anypb.New(foo)\n     if err != nil {\n       ...\n     }\n     ...\n     foo := &pb.Foo{}\n     if err := any.UnmarshalTo(foo); err != nil {\n       ...\n     }\n\nThe pack methods provided by protobuf library will by default use\n'type.googleapis.com/full.type.name' as the type URL and the unpack\nmethods only use the fully qualified type name after the last '/'\nin the type URL, for example \"foo.bar.com/x/y.z\" will yield type\nname \"y.z\".\n\nJSON\n====\nThe JSON representation of an `Any` value uses the regular\nrepresentation of the deserialized, embedded message, with an\nadditional field `@type` which contains the type URL. Example:\n\n    package google.profile;\n    message Person {\n      string first_name = 1;\n      string last_name = 2;\n    }\n\n    {\n      \"@type\": \"type.googleapis.com/google.profile.Person\",\n      \"firstName\": <string>,\n      \"lastName\": <string>\n    }\n\nIf the embedded message type is well-known and has a custom JSON\nrepresentation, that representation will be embedded adding a field\n`value` which holds the custom JSON in addition to the `@type`\nfield. Example (for message [google.protobuf.Duration][]):\n\n    {\n      \"@type\": \"type.googleapis.com/google.protobuf.Duration\",\n      \"value\": \"1.212s\"\n    }"

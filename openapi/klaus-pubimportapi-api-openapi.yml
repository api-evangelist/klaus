openapi: 3.2.0
info:
  title: Public Import Pub Import API
  description: 'Import data to Zendesk QA.


    ### Rate Limits:


    - API import comment limit: **500 comments per ticket**

    - API import limit: **10,000 tickets per import**

    - API request limit: **1,500 requests per minute per IP**'
  version: '1.0'
servers:
- url: https://yoursubdomain.zendesk.com/qa
security:
- ApiKeyAuth: []
tags:
- name: PubImportApi
paths:
  /api/import/tickets:
    delete:
      operationId: PubImportApi_DeleteImportedTicket
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: ticketExternalIds
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      tags:
      - PubImportApi
      summary: Pub import api delete imported ticket
      x-summary-source: derived
    post:
      operationId: PubImportApi_ImportTickets
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - PubImportApi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/protoPubTicketImportRequest'
        required: true
      summary: Pub import api import tickets
      x-summary-source: derived
  /api/import/tickets/{ticketExternalId}:
    get:
      operationId: PubImportApi_GetImportedTicket
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protoPubImportedTicket'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: ticketExternalId
        in: path
        required: true
        schema:
          type: string
      tags:
      - PubImportApi
      summary: Pub import api get imported ticket
      x-summary-source: derived
  /api/import/users:
    post:
      operationId: PubImportApi_ImportUsers
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
      - PubImportApi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/protoPubUserImportRequest'
        required: true
      summary: Pub import api import users
      x-summary-source: derived
components:
  schemas:
    protoPubCommentImport:
      type: object
      properties:
        id:
          type: string
        authorName:
          type: string
        authorEmail:
          type: string
        authorIsNotClient:
          type: boolean
        public:
          type: boolean
        comment:
          type: string
        created:
          type: string
        updated:
          type: string
        recordingUrl:
          type: string
        attachmentUrl:
          type: string
        attachmentName:
          type: string
        callDuration:
          type: string
          format: int64
        callDirection:
          type: string
        isBucketKey:
          type: boolean
    protoPubUserImportRequest:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoPubUserImport'
    protoPubTicketImportRequest:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoPubTicketImport'
    rpcStatus:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protobufAny'
    protobufAny:
      type: object
      properties:
        '@type':
          type: string
      additionalProperties: {}
    protoPubTicketFieldValue:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
    protoPubTicketField:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        updated:
          type: string
        values:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoPubTicketFieldValue'
    protoPubUserImport:
      type: object
      properties:
        userEmail:
          type: string
        userName:
          type: string
    protoPubImportedTicket:
      type: object
      properties:
        externalId:
          type: string
        internalId:
          type: string
          format: int64
        assigneeEmail:
          type: string
        assigneeName:
          type: string
        description:
          type: string
        subject:
          type: string
        created:
          type: string
        updated:
          type: string
        imported:
          type: string
        status:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        comments:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoPubImportedComment'
        ticketFields:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoPubTicketField'
        url:
          type: string
        tags:
          type: array
          items:
            type: string
    protoPubImportedComment:
      type: object
      properties:
        externalId:
          type: string
        internalId:
          type: string
          format: int64
        authorName:
          type: string
        authorEmail:
          type: string
        public:
          type: boolean
        comment:
          type: string
        created:
          type: string
        updated:
          type: string
        imported:
          type: string
        recordingUrl:
          type: string
        attachmentUrl:
          type: string
        attachmentName:
          type: string
        callDuration:
          type: string
          format: int64
    protoPubTicketImport:
      type: object
      properties:
        id:
          type: string
        assigneeEmail:
          type: string
        assigneeName:
          type: string
        description:
          type: string
        subject:
          type: string
        created:
          type: string
        updated:
          type: string
        status:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        comments:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoPubCommentImport'
        ticketFields:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/protoPubTicketField'
        channel:
          type: string
        type:
          type: string
        satisfactionScore:
          type: string
        satisfactionComment:
          type: string
        closed:
          type: string
        url:
          type: string
        tags:
          type: array
          items:
            type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: Enter the token with the "Bearer " prefix
      name: Authorization
      in: header

summary: >-
  Neither published specification enumerates individual 4xx/5xx responses. Every
  operation in both the Public Export API and the Public Import API declares exactly
  two responses: a 200 with the success payload, and a catch-all `default` described
  as "An unexpected error response" carrying the google.rpc.Status envelope. This is
  the standard grpc-gateway shape. No error-code registry is published for the Klaus
  public APIs.

aid: klaus
name: Klaus
description: 'Klaus is an AI-powered conversation review and quality assurance (QA) platform
  for customer support teams, founded in Tallinn, Estonia in 2019 and acquired by Zendesk in
  2023, where it now ships as Zendesk QA. The product samples support conversations from
  connected help desks, scores them against configurable scorecards and rating categories,
  runs AutoQA checks, tracks disputes and calibration sessions, measures CSAT, and delivers
  coaching, quizzes and agent-performance dashboards. Klaus exposes two public REST APIs —
  a Public Import API for pushing conversations and users into QA from a custom help desk,
  and a Public Export API for pulling reviews, AutoQA ratings, CSAT, disputes, calibration
  sessions, scorecards, quizzes and users back out for external analysis. Both are documented
  as Swagger 2.0 specifications at pub.klausapp.com and authenticated with a bearer API token
  issued from a Zendesk QA custom integration.'
